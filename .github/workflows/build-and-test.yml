name: iOS Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ios-build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMake প্রজেক্ট হলে Xcode প্রজেক্ট জেনারেট করা
      - name: Configure CMake for iOS
        run: |
          mkdir build
          cd build
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos

      # অ্যাপ বিল্ড এবং আর্কাইভ করা
      - name: Build Xcode Project
        run: |
          cd build
          xcodebuild -target YourTargetName -configuration Release -sdk iphoneos

      # বিল্ড ফাইল (Artifact) আপলোড করা যা আপনি ডাউনলোড করতে পারবেন
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-app
          path: build/Release-iphoneos/
