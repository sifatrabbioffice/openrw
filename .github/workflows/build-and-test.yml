name: Build iOS IPA (Sideloadable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ios-build:
    name: iOS IPA Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. ডিপেনডেন্সি ইনস্টল করা
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake ninja boost glm ffmpeg sdl2 bullet freetype

      # ২. শুধুমাত্র বুস্ট এবং ওপেনজিএল ডিপেনডেন্সি প্যাচ করা (কোনো ফাইল ব্রেকিং মডিফিকেশন ছাড়া)
      - name: Patch CMakeLists for iOS Dependencies
        run: |
          # বুস্ট ফিক্স
          sed -i '' 's/find_package(Boost.*COMPONENTS.*/find_package(Boost REQUIRED)/g' CMakeLists.txt
          sed -i '' '/find_package(Boost REQUIRED)/a\
          set(Boost_INCLUDE_DIRS /opt/homebrew/include)\
          set(Boost_LIBRARY_DIRS /opt/homebrew/lib)\
          include_directories(${Boost_INCLUDE_DIRS})\
          link_directories(${Boost_LIBRARY_DIRS})\
          ' CMakeLists.txt
          
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::program_options/boost_program_options/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::system/boost_system/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::filesystem/boost_filesystem/g' {} +

          # ওপেনজিএল ফিক্স
          sed -i '' '/find_package(OpenGL REQUIRED)/c\
          set(OPENGL_FOUND TRUE)\
          set(OPENGL_INCLUDE_DIR /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.5.sdk/System/Library/Frameworks/OpenGLES.framework/Headers)\
          set(OPENGL_LIBRARIES "-framework OpenGLES")\
          ' CMakeLists.txt

      # ৩. ক্রস-কম্পাইল কনফিগারেশন (প্ল্যাটফর্ম এরর বাইপাস করার জন্য Xcode জেনারেটর প্লাস আইওএস আর্কিটেকচার ফোর্স)
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # এখানে আমরা ডিরেক্টলি iOS প্ল্যাটফর্মের নাম না দিয়ে Xcode কে arm64 এবং iOS SDK ব্যবহার করতে বাধ্য করছি
          cmake .. -G Xcode \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_PREFIX_PATH="/opt/homebrew" \
            -DCMAKE_FIND_ROOT_PATH="/opt/homebrew" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=""

      # ৪. Xcode এর মাধ্যমে আইফোন প্ল্যাটফর্মের জন্য কম্পাইল করা
      - name: Build App Using Xcode
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }} -- -sdk iphoneos

      # ৫. বিল্ড হওয়া বাইনারিকে Sideloadable .ipa ফাইলে প্যাকেজিং করা
      - name: Package into Sideloadable .ipa
        run: |
          mkdir -p build/Payload
          
          # এক্সিকিউটেবল বা অ্যাপ বান্ডেল খুঁজে বের করা
          APP_PATH=$(find build -name "rwgame" -type f -o -name "*.app" -type d | head -n 1)
          echo "Found Target Asset at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No build asset found!"
            exit 1
          fi
          
          # যদি এটি ডিরেক্টরি (.app) না হয়ে শুধু ফাইল হয়, তবে আইওএস আর্কিটেকচারের জন্য একটি ডামি বান্ডেল স্ট্রাকচার তৈরি করা
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
          else
            mkdir -p build/Payload/rwgame.app
            cp "$APP_PATH" build/Payload/rwgame.app/rwgame
            # একটি বেসিক Info.plist তৈরি করা যাতে সাইডলোড করার সময় TrollStore/AltStore চিনতে পারে
            cat << 'EOF' > build/Payload/rwgame.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.txt">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>rwgame</string>
              <key>CFBundleIdentifier</key>
              <string>org.openrw.rwgame</string>
              <key>CFBundleName</key>
              <string>OpenRW</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF
          fi
          
          cd build
          zip -r openrw-sideload.ipa Payload/

      # ৬. ফাইনাল .ipa ফাইলটি আপলোড করা
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-ios-sideload
          path: build/openrw-sideload.ipa
