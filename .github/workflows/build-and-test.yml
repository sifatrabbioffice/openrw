name: Build iOS IPA (Sideloadable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ios-build:
    name: iOS IPA Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. ডিপেনডেন্সি ইনস্টল করা
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake ninja boost glm ffmpeg sdl2 bullet freetype

      # ২. CMakeLists.txt এবং প্ল্যাটফর্ম চেক প্যাচ করা
      - name: Patch CMakeLists and Platform Checks for iOS
        run: |
          # বুস্ট ফিক্স
          sed -i '' 's/find_package(Boost.*COMPONENTS.*/find_package(Boost REQUIRED)/g' CMakeLists.txt
          sed -i '' '/find_package(Boost REQUIRED)/a\
          set(Boost_INCLUDE_DIRS /opt/homebrew/include)\
          set(Boost_LIBRARY_DIRS /opt/homebrew/lib)\
          include_directories(${Boost_INCLUDE_DIRS})\
          link_directories(${Boost_LIBRARY_DIRS})\
          ' CMakeLists.txt
          
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::program_options/boost_program_options/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::system/boost_system/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::filesystem/boost_filesystem/g' {} +

          # ওপেনজিএল ফিক্স
          sed -i '' '/find_package(OpenGL REQUIRED)/c\
          set(OPENGL_FOUND TRUE)\
          set(OPENGL_INCLUDE_DIR /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.5.sdk/System/Library/Frameworks/OpenGLES.framework/Headers)\
          set(OPENGL_LIBRARIES "-framework OpenGLES")\
          ' CMakeLists.txt

          # প্ল্যাটফর্ম এরর ফিক্স: cmake_configure.cmake ফাইলের ভেতরের "Unknown platform" এরর লজিকটি স্কিপ করানো
          # এটি iOS প্ল্যাটফর্ম ডিটেক্ট করলে তাকে ইন্টারনালি "macOS" বা "APPLE" ফ্লো ব্যবহার করতে বাধ্য করবে
          if [ -f cmake_configure.cmake ]; then
            sed -i '' 's/message(FATAL_ERROR "Unknown platform/message(STATUS "Forcing iOS Platform Build/g' cmake_configure.cmake
          fi

      # ৩. Xcode জেনারেটর ব্যবহার করে আইওএস টার্গেটে কনফিগারেশন করা
      - name: Configure CMake for iOS
        run: |
          mkdir build
          cd build
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="/opt/homebrew" \
            -DCMAKE_FIND_ROOT_PATH="/opt/homebrew" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=""

      # ৪. Xcode এর মাধ্যমে আইফোন প্ল্যাটফর্মের জন্য বিল্ড করা
      - name: Build App Using Xcode
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }} -- -sdk iphoneos

      # ৫. বিল্ড হওয়া .app ফাইলকে Sideloadable .ipa ফাইলে প্যাকেজিং করা
      - name: Package into Sideloadable .ipa
        run: |
          mkdir -p build/Payload
          
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found App Bundle at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found! Build might have failed or generated a standard executable instead."
            exit 1
          fi
          
          cp -r "$APP_PATH" build/Payload/
          
          cd build
          zip -r openrw-sideload.ipa Payload/

      # ৬. ফাইনাল .ipa ফাইলটি আপলোড করা
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-ios-sideload
          path: build/openrw-sideload.ipa
