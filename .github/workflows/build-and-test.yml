name: Build and Test (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ALSOFT_DRIVERS: "null"

jobs:
  macos-build:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. ডিপেনডেন্সি ইনস্টল করা
      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install cmake ninja boost sdl2 openal-soft ffmpeg bullet glm freetype qt@5
          
          # এখানে একসাথে সবকিছুর পাথ CMAKE_PREFIX_PATH-এ ইনজেক্ট করা হচ্ছে
          # বিশেষ করে boost এবং তার সাব-মডিউলগুলোর সঠিক লিঙ্কিংয়ের জন্য এটি জরুরি
          BOOST_PREFIX=$(brew --prefix boost)
          QT_PREFIX=$(brew --prefix qt@5)
          OPENAL_PREFIX=$(brew --prefix openal-soft)
          
          echo "CMAKE_PREFIX_PATH=${BOOST_PREFIX}:${BOOST_PREFIX}/lib/cmake:${QT_PREFIX}:${OPENAL_PREFIX}:$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
          echo "PATH=${QT_PREFIX}/bin:$PATH" >> $GITHUB_ENV

      # ২. পরিচ্ছন্ন CMake কনফিগারেশন (সরাসরি সিস্টেম ডিরেক্টরি পয়েন্ট করে)
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBOOST_INCLUDEDIR=$(brew --prefix boost)/include \
            -DBOOST_LIBRARYDIR=$(brew --prefix boost)/lib

      # ৩. প্রজেক্ট বিল্ড করা
      - name: Build Project
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}

      # ৪. বিল্ড হওয়া ফাইলটি আপলোড করা
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-macos-build
          path: build/
