steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # macOS-এর জন্য প্রয়োজনীয় ডিপেনডেন্সি ইনস্টল করার স্টেপ
      - name: Install Dependencies (macOS)
        run: |
          brew update
          brew install cmake ninja boost sdl2 openal-soft ffmpeg bullet glm freetype qt@5
          
          # Qt5 এর পাথ সেট করা যেন CMake এটি খুঁজে পায়
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .
