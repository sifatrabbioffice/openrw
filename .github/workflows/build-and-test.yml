name: Build and Test (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ALSOFT_DRIVERS: "null"

jobs:
  macos-build:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. ডিপেনডেন্সি ইনস্টল করা
      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install cmake ninja boost sdl2 openal-soft ffmpeg bullet glm freetype qt@5
          
          # পাথ কনফিগারেশন
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5):$(brew --prefix openal-soft):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> $GITHUB_ENV

      # ২. সবচেয়ে গুরুত্বপূর্ণ ট্রিক: ঝামেলাকারী CMake কনফিগ ফাইলগুলো মুছে ফেলা
      - name: Remove problematic Boost CMake configs
        run: |
          # Homebrew-এর বুস্টের ভেতরের ত্রুটিপূর্ণ cmake ফোল্ডারটি সম্পূর্ণ ডিলিট করে দেওয়া হচ্ছে
          rm -rf $(brew --prefix boost)/lib/cmake/Boost-1.90.0
          rm -rf $(brew --prefix boost)/lib/cmake/boost_*

      # ৩. সহজ ও সাধারণ CMake কনফিগারেশন
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      # ৪. প্রজেক্ট বিল্ড করা
      - name: Build Project
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}

      # ৫. বিল্ড হওয়া ফাইলটি আপলোড করা
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-macos-build
          path: build/
