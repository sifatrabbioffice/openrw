name: Build and Test (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ALSOFT_DRIVERS: "null"

jobs:
  macos-build:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. ডিপেনডেন্সি ইনস্টল করা
      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install cmake ninja boost sdl2 openal-soft ffmpeg bullet glm freetype qt@5
          
          # পাথ এবং বুস্টের গ্লোবাল এনভায়রনমেন্ট ফ্ল্যাগ সেট করা
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5):$(brew --prefix openal-soft):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> $GITHUB_ENV
          
          # CMake-কে গ্লোবালি ফোর্স করা যেন সে বুস্টের নিজস্ব CMake কনফিগ ইগনোর করে
          echo "Boost_NO_BOOST_CMAKE=ON" >> $GITHUB_ENV

      # ২. CMake কনফিগারেশন (উইন্ডো মেথড বাইপাস)
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          
          # এখানে আমরা সরাসরি CMake-কে বুস্টের লাইব্রেরি ডিরেক্টরি ইনজেক্ট করে দিচ্ছি 
          # যেন সে কোনো ফাইল স্ক্যান না করে সরাসরি বাইনারি খুঁজে নেয়
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBoost_NO_SYSTEM_PATHS=OFF \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBOOST_LIBRARYDIR=$(brew --prefix boost)/lib \
            -Dboost_system_DIR=$(brew --prefix boost)/lib/cmake/boost_system-1.90.0 \
            -DBoost_INCLUDE_DIR=$(brew --prefix boost)/include

      # ৩. প্রজেক্ট বিল্ড করা
      - name: Build Project
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}

      # ৪. বিল্ড হওয়া ফাইলটি আপলোড করা
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-macos-build
          path: build/
