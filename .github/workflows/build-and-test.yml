name: Build iOS IPA (Sideloadable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ios-build:
    name: iOS IPA Build
    runs-on: macos-14 # Apple Silicon (M1/M2) রানার ব্যবহার করা হচ্ছে দ্রুত বিল্ডের জন্য

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. আইওএস বিল্ডের জন্য প্রয়োজনীয় টুলস এবং ডিপেনডেন্সি ইনস্টল (Vcpkg বা Homebrew দিয়ে)
      - name: Install Build Tools
        run: |
          brew update
          brew install cmake ninja boost glm toolchains

      # ২. CMake কে iOS আর্কিটেকচারে (arm64) কনফিগার করা
      - name: Configure CMake for iOS
        run: |
          mkdir build
          cd build
          # Xcode এবং iOS SDK ব্যবহার করে arm64 আর্কিটেকচারে কনফিগারেশন
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=""

      # ৩. Xcode বিল্ড রান করা
      - name: Build App Vector Using Xcode
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }} -- -sdk iphoneos

      # ৪. বিল্ড হওয়া .app কে Sideloadable .ipa ফাইলে রূপান্তর করা (Ad-hoc প্যাকেজিং)
      - name: Package Package into Sideloadable .ipa
        run: |
          mkdir -p build/Payload
          
          # আপনার প্রজেক্টের আউটপুট .app ফাইলটি Payload ফোল্ডারে কপি করা হচ্ছে
          # দ্রষ্টব্য: আপনার প্রজেক্টের এক্সিকিউটেবল নাম অনুযায়ী 'rwgame.app' পরিবর্তন হতে পারে
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found App Bundle at: $APP_PATH"
          
          cp -r "$APP_PATH" build/Payload/
          
          # জিপ করে .ipa ফরম্যাটে রূপান্তর
          cd build
          zip -r openrw-sideload.ipa Payload/

      # ৫. Sideload করার জন্য প্রস্তুত .ipa ফাইলটি আপলোড করা
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-ios-sideload
          path: build/openrw-sideload.ipa
