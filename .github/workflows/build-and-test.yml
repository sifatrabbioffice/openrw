name: Build and Test (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ALSOFT_DRIVERS: "null"

jobs:
  macos-build:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. ডিপেনডেন্সি ইনস্টল করা
      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install cmake ninja boost sdl2 openal-soft ffmpeg bullet glm freetype qt@5
          
          # পাথ সেট করা
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5):$(brew --prefix openal-soft):$(brew --prefix boost):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> $GITHUB_ENV

      # ২. সাব-মডিউলসহ সব ফাইলের বুস্ট লিঙ্কিং প্যাচ করা
      - name: Patch CMakeLists for Boost Targets
        run: |
          # মেইন ফাইলের কম্পোনেন্ট রিকোয়েস্ট রিমুভ করা
          sed -i '' 's/find_package(Boost.*COMPONENTS.*/find_package(Boost REQUIRED)/g' CMakeLists.txt
          
          # গ্লোবাল বুস্ট ডিরেক্টরি ইনক্লুড করা
          sed -i '' '/find_package(Boost REQUIRED)/a\
          include_directories(${Boost_INCLUDE_DIRS})\
          link_directories(${Boost_LIBRARY_DIRS})\
          ' CMakeLists.txt
          
          # সাব-ফাইলগুলোতে Boost:: টার্গেটগুলোকে সরাসরি ভ্যারিয়েবল দিয়ে রিপ্লেস করা
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::program_options/${Boost_LIBRARIES}/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::system/${Boost_LIBRARIES}/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::filesystem/${Boost_LIBRARIES}/g' {} +

      # ৩. পরিচ্ছন্ন CMake কনফিগারেশন (সরাসরি বুস্টের বাইনারি লাইব্রেরি লিঙ্ক করা)
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          
          # Homebrew-এর বুস্ট লাইব্রেরি পাথ এবং নির্দিষ্ট লাইব্রেরি ফাইল এক্সপ্লিসিটলি পাস করা হচ্ছে
          # এটি linker-কে সরাসরি libboost_program_options এবং libboost_system চিনিয়ে দেবে
          BOOST_LIB_DIR=$(brew --prefix boost)/lib
          
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_EXE_LINKER_FLAGS="-L${BOOST_LIB_DIR} -lboost_program_options -lboost_system" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L${BOOST_LIB_DIR} -lboost_program_options -lboost_system"

      # ৪. প্রজেক্ট বিল্ড করা
      - name: Build Project
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}

      # ৫. বিল্ড হওয়া ফাইলটি আপলোড করা
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-macos-build
          path: build/rwgame/rwgame
