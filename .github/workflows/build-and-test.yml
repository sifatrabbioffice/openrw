name: Build and Test (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ALSOFT_DRIVERS: "null"

jobs:
  macos-build:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. ডিপেনডেন্সি ইনস্টল করা
      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install cmake ninja boost sdl2 openal-soft ffmpeg bullet glm freetype qt@5
          
          # পাথ সেট করা
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5):$(brew --prefix openal-soft):$(brew --prefix boost):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> $GITHUB_ENV

      # ২. ম্যাজিক স্টেপ: OpenRW-এর CMakeLists.txt ফাইল প্যাচ/মডিফাই করা
      - name: Patch CMakeLists.txt for Boost Components
        run: |
          # CMakeLists.txt ফাইলের ভেতর যেখানে নির্দিষ্ট কম্পোনেন্ট (system, program_options) চাওয়া হয়েছে, 
          # সেটিকে পরিবর্তন করে শুধু গ্লোবাল Boost খোঁজার কমান্ডে রূপান্তর করা হচ্ছে।
          sed -i '' 's/find_package(Boost.*COMPONENTS.*/find_package(Boost REQUIRED)/g' CMakeLists.txt
          
          # লাইঙ্কিং এরর এড়াতে বুস্টের হেডার ও লাইব্রেরি গ্লোবালি ডিক্লেয়ার করা
          sed -i '' '/find_package(Boost REQUIRED)/a\
          include_directories(${Boost_INCLUDE_DIRS})\
          link_directories(${Boost_LIBRARY_DIRS})\
          ' CMakeLists.txt

      # ৩. পরিচ্ছন্ন CMake কনফিগারেশন
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBOOST_ROOT=$(brew --prefix boost)

      # ৪. প্রজেক্ট বিল্ড করা
      - name: Build Project
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}

      # ৫. বিল্ড হওয়া ফাইলটি আপলোড করা
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-macos-build
          path: build/
