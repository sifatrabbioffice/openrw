name: Build iOS IPA (Sideloadable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ios-build:
    name: iOS IPA Build
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. ডিপেনডেন্সি ইনস্টল করা (এরর দেওয়া toolchains প্যাকেজটি বাদ দেওয়া হয়েছে)
      # বুস্টকে iOS ফ্রেমওয়ার্ক হিসেবে ডাউনলোড/বিল্ড করার জন্য গ্লোবাল হোমব্রু বুস্ট এড়িয়ে চলাই ভালো
      # তাই বুস্ট ছাড়া বাকি প্রয়োজনীয় হেডার লাইব্রেরিগুলো নেওয়া হচ্ছে
       Tar: install build tools
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake ninja glm freetype sdl2 openal-soft ffmpeg bullet
          
          # iOS এর জন্য এনভায়রনমেন্ট পাথ সেটআপ
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openal-soft):$(brew --prefix glm):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV

      # ২. CMake কে iOS আর্কিটেকচারে (Xcode Generator) কনফিগার করা
      # কোনো এক্সটার্নাল টুলচেইন ফাইল ছাড়া সরাসরি Xcode SDK কে টার্গেট করা হয়েছে
      - name: Configure CMake for iOS
        run: |
          mkdir build
          cd build
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
            -DBoost_NO_BOOST_CMAKE=ON

      # ৩. Xcode বিল্ড রান করা (সরাসরি iPhone OS SDK দিয়ে কম্পাইল)
      - name: Build App Package Using Xcode
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }} -- -sdk iphoneos

      # ৪. বিল্ড হওয়া .app কে Sideloadable .ipa ফাইলে প্যাকেজিং করা
      - name: Package Bundle into Sideloadable .ipa
        run: |
          mkdir -p build/Payload
          
          # জেনারেট হওয়া .app ফাইলটি খুঁজে বের করে Payload ডিরেক্টরিতে কপি করা
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found! Build might have failed."
            exit 1
          fi
          echo "Found App Bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          
          # Payload ফোল্ডারটিকে জিপ করে .ipa এক্সটেনশন দেওয়া
          cd build
          zip -r openrw-ios-sideload.ipa Payload/

      # ৫. Sideload করার জন্য প্রস্তুত .ipa ফাইলটি আপলোড করা
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-ios-sideload
          path: build/openrw-ios-sideload.ipa
